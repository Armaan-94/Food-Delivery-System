# Shared by every service. Secrets are never stored here: they are ${PLACEHOLDERS} resolved from the
# environment of the service process.

eureka.client.service-url.defaultZone=http://${EUREKA_USER}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true

# HS256 secret used to sign and verify JWTs. At least 32 characters.
jwt.secret=${JWT_SECRET}
jwt.issuer=food-delivery
jwt.access-token-minutes=60

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Never leak stack traces or exception text in error bodies.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
