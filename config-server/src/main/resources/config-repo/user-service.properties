server.port=7575

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/user_db
spring.datasource.username=${MYSQL_USER:food_delivery}
spring.datasource.password=${MYSQL_PASSWORD}

# Optional: create this administrator on startup if the account does not exist yet.
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.name=Administrator
