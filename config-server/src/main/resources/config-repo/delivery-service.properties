server.port=8081

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/delivery_db
spring.datasource.username=${MYSQL_USER:food_delivery}
spring.datasource.password=${MYSQL_PASSWORD}

# Outgoing calls to other services (order-service) time out instead of hanging.
app.http-client.connect-timeout-ms=2000
app.http-client.read-timeout-ms=5000
