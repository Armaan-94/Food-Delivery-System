server.port=8085

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/order_db
spring.datasource.username=${MYSQL_USER:food_delivery}
spring.datasource.password=${MYSQL_PASSWORD}

# The schema is created by db/init.sql; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
