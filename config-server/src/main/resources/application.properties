spring.application.name=config-server
server.port=8888

# Serve the property files bundled in config-repo/ (no Git backend).
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config-repo/

# Clients authenticate with these credentials (spring.cloud.config.username/password).
spring.security.user.name=${CONFIG_SERVER_USER}
spring.security.user.password=${CONFIG_SERVER_PASSWORD}

management.endpoints.web.exposure.include=health,info
