# Runs the whole platform: docker compose up --build
# Requires a .env file (see .env.example). Only the gateway (9004) and, for convenience, MySQL are published.

x-service-env: &service-env
  CONFIG_SERVER_HOST: config-server
  CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:?set CONFIG_SERVER_USER in .env}
  CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?set CONFIG_SERVER_PASSWORD in .env}
  EUREKA_HOST: service-discovery
  EUREKA_USER: ${EUREKA_USER:?set EUREKA_USER in .env}
  EUREKA_PASSWORD: ${EUREKA_PASSWORD:?set EUREKA_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  MYSQL_HOST: mysql
  MYSQL_USER: food_delivery
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: user_db
      MYSQL_USER: food_delivery
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  config-server:
    build: { context: ., args: { MODULE: config-server } }
    environment:
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:?set CONFIG_SERVER_USER in .env}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?set CONFIG_SERVER_PASSWORD in .env}
    healthcheck: &healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  service-discovery:
    build: { context: ., args: { MODULE: service-discovery } }
    environment: *service-env
    depends_on:
      config-server: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]

  user-service:
    build: { context: ., args: { MODULE: user-service } }
    environment:
      <<: *service-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mysql: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:7575/actuator/health || exit 1"]

  order-service:
    build: { context: ., args: { MODULE: order-service } }
    environment: *service-env
    depends_on:
      mysql: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]

  delivery-service:
    build: { context: ., args: { MODULE: delivery-service } }
    environment: *service-env
    depends_on:
      mysql: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]

  auth-service:
    build: { context: ., args: { MODULE: auth-service } }
    environment: *service-env
    depends_on:
      user-service: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:9005/actuator/health || exit 1"]

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    environment: *service-env
    depends_on:
      auth-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      delivery-service: { condition: service_healthy }
    ports:
      - "9004:9004"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:9004/actuator/health || exit 1"]

volumes:
  mysql-data:
